# Stillwater — a clean, GNOME-inspired lock screen for hyprlock 0.9.6.
# Soft wallpaper, a clear white clock and generous spacing. No shadows.
# Blank monitor values cover every output.
# Positions and sizes are logical pixels, including on fractional-scale displays.

$font = Adwaita Sans

general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
    fractional_scaling = 2
    fail_timeout = 2500
}

auth {
    pam {
        enabled = true
        module = hyprlock
    }
}

animations {
    enabled = true
    bezier = gentle, 0.2, 0.0, 0.0, 1.0
    animation = fade, 0
    animation = inputField, 0
    # Keep background color transitions short and smooth.
    animation = inputFieldColors, 1, 1, gentle
    animation = inputFieldDots, 1, 2, gentle
}

background {
    monitor =
    path = $HOME/.config/background
    color = rgba(344c5bff)
    blur_passes = 3
    blur_size = 7
    brightness = 0.72
    contrast = 0.95
    vibrancy = 0.08
    vibrancy_darkness = 0.05
    noise = 0
}

# Large, quiet clock with tabular digits to keep its width steady.
label {
    monitor =
    text = <span weight="bold" font_features="tnum">$TIME</span>
    color = rgba(ffffffff)
    font_size = 128
    font_family = $font
    position = 0, 140
    halign = center
    valign = center
    shadow_passes = 0
}

# Always display an English date, regardless of the session locale.
label {
    monitor =
    text = cmd[update:60000] LC_ALL=C date '+%A, %B %-d'
    color = rgba(ffffffe6)
    font_size = 17
    font_family = $font
    position = 0, 18
    halign = center
    valign = center
    shadow_passes = 0
}

# Invisible input area: typing reveals only password dots.
# Keep a brief failure message so an unsuccessful attempt is still apparent.
input-field {
    monitor =
    size = 288, 48
    outline_thickness = 0
    rounding = 0
    outer_color = rgba(00000000)
    inner_color = rgba(00000000)
    font_color = rgba(ffffffff)
    font_family = $font
    dots_size = 0.30
    dots_spacing = 0.30
    dots_center = true
    dots_rounding = -1
    fade_on_empty = false
    placeholder_text =
    check_text =
    fail_text = <span size="12000">Try again</span>
    check_color = rgba(b9d9f4ff)
    fail_color = rgba(c88f8fff)
    capslock_color = rgba(c5b18aff)
    bothlock_color = rgba(c5b18aff)
    # Show Caps Lock / failure feedback as an animated background color block.
    swap_font_color = false
    position = 0, -116
    halign = center
    valign = center
    shadow_passes = 0
}
